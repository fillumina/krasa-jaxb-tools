# This workflow builds the project and runs its tests when a release is created.
# For more information see: https://github.com/actions/setup-java/blob/main/docs/advanced-usage.md

name: Maven Build

on:
  release:
    types: [created]

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'

    - name: Build and run the tests
      run: mvn -B test --file pom.xml
